name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # rustup installs the toolchain of rust-toolchain.toml (with clippy
      # and rustfmt) on the first cargo call.
      - name: Toolchain
        run: rustup show
      # egui-lessons plays its voice by rodio (cpal: ALSA on Linux).
      - name: ALSA
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy (egui-lessons, no playback or ui)
        run: cargo clippy -p egui-lessons --all-targets --no-default-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Python
        run: python3 -m py_compile scripts/*.py
      # The lessons' keys are the recorder's: the fixture written again by
      # the recorder's own code must be the one the Rust tests read.
      - name: Key fixture
        run: python3 scripts/lesson_fixture.py --check
